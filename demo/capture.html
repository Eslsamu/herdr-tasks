<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Herdr Tasks example walkthrough</title>
<style>
* { box-sizing: border-box; }
html,body { margin:0; width:1440px; height:900px; overflow:hidden; background:#1e1e2e; color:#cdd6f4; }
header { height:40px; padding:10px 18px; font:16px system-ui; background:#181825; display:flex; justify-content:space-between; }
main { position:relative; height:860px; }
pre { margin:0; padding:10px 18px; font:18px/23px Menlo,monospace; overflow:hidden; }
section { position:absolute; inset:0; background:#101310; }
.address { display:none; }
img { display:block; width:1440px; height:860px; }
</style>
<header><span>Herdr · SpaceName</span></header>
<main><pre id="terminal"></pre><section><div class="address">Browser · localhost · Tasks</div><img id="viewer" alt="Space task queue"></section></main>
<script>
Promise.all([fetch('/terminal.json').then(r=>r.json()),fetch('/capture-data.json').then(r=>r.json())]).then(async ([frames,data])=>{
  if (!data.synthetic) throw new Error('Expected synthetic fixture');
  for (const state of ['queued','doing']) { const image=new Image();image.src='/shots/'+state+'.png';await image.decode(); }
  window.__setDemoTime = ms => {
    const step=ms<5000?0:ms<11000?1:ms<17000?2:3;
    document.querySelector('#terminal').innerHTML=frames[step];
    document.querySelector('#viewer').src='/shots/'+(step<3?'queued':'doing')+'.png';
    const browser=ms>=11000 && ms<17000 || ms>=19500;
    document.querySelector('section').style.visibility=browser?'visible':'hidden';
    document.querySelector('header span').textContent=browser?'Browser · localhost · Tasks':'Herdr · SpaceName';
  };
  window.__setDemoTime(0);
  document.documentElement.dataset.captureReady='true';
  window.__DEMO_READY__=true;
}).catch(error=>{document.documentElement.dataset.captureError=error.message;throw error;});
</script>
</html>
