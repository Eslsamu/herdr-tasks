id = "herdr-tasks"
name = "Tasks"
version = "0.3.3"
description = "An agent-owned work queue with a live local viewer and space summary."
min_herdr_version = "0.8.2"
platforms = ["macos", "linux"]

[[startup]]
command = ["sh", "run.sh", "web-start"]

[[panes]]
id = "board"
title = "Tasks · terminal fallback"
placement = "split"
command = ["sh", "run.sh", "view"]

[[actions]]
id = "open"
title = "Tasks: open space queue in browser"
command = ["sh", "run.sh", "open"]

[[actions]]
id = "pane"
title = "Tasks: open terminal fallback"
command = ["sh", "run.sh", "pane"]

[[actions]]
id = "setup"
title = "Tasks: install CLI and space summary"
command = ["sh", "run.sh", "setup"]

[[actions]]
id = "uninstall"
title = "Tasks: remove integration (keep task data)"
command = ["sh", "run.sh", "uninstall"]
