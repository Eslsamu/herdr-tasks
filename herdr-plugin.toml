id = "herdr-tasks"
name = "Tasks"
version = "0.1.0"
description = "A shared task board maintained by your existing agents. You just watch."
min_herdr_version = "0.8.2"
platforms = ["macos", "linux"]

[[panes]]
id = "board"
title = "Tasks"
placement = "overlay"
command = ["python3", "herdr_tasks.py", "view"]

[[actions]]
id = "open"
title = "Tasks: view agent board"
command = ["python3", "herdr_tasks.py", "open"]

[[actions]]
id = "setup"
title = "Tasks: install CLI and shortcut"
command = ["python3", "herdr_tasks.py", "setup"]

[[actions]]
id = "uninstall"
title = "Tasks: remove integration (keep task data)"
command = ["python3", "herdr_tasks.py", "uninstall"]
