name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m py_compile herdr_tasks.py queue_view.py demo/make_fixture.py test_herdr_tasks.py test_demo.py
      - name: Test
        run: python -W error::ResourceWarning -m unittest -v
      - name: Validate launcher
        run: sh -n run.sh
      - name: Validate browser JavaScript
        run: |
          node --check web/app.js
          node --check demo/capture_demo.mjs
